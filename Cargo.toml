[package]
name = "proc-connector"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A safe, modern Rust wrapper for the Linux Process Event Connector (netlink PROC_EVENT_*)"
documentation = "https://docs.rs/proc-connector"
repository = "https://github.com/lenitain/proc-connector"
readme = "README.md"
keywords = ["linux", "netlink", "proc", "process", "connector"]
categories = ["os", "api-bindings"]
authors = ["lenitain <xt.zhu@qq.com>"]

include = [
    "examples",
    "Cargo.toml",
    "LICENSE",
    "CHANGELOG.md",
    "README.md",
    "src/",
    "tests/",
]

[lib]
name = "proc_connector"
path = "src/lib.rs"

[dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
